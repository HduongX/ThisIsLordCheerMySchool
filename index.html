<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng Câu Hỏi | Trích Xuất Đề</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Thư viện xuất PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- CSS Nội bộ -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm no-print">
        <div class="flex items-center gap-3">
            <div class="bg-brand-600 text-white p-2 rounded-lg shadow-md">
                <i data-lucide="library" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Question Extractor</h1>
                <p class="text-xs text-gray-500 font-medium">Hệ thống trích xuất ngân hàng câu hỏi</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleAnswers()" id="btn-toggle-ans" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition shadow-sm text-gray-700">
                <i data-lucide="eye-off" class="w-4 h-4"></i> <span>Hiện đáp án</span>
            </button>
            <div class="h-6 w-px bg-gray-300 mx-1"></div>
            <button onclick="exportWord()" class="flex items-center gap-2 px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition shadow-sm">
                <i data-lucide="file-text" class="w-4 h-4"></i> Word
            </button>
            <button onclick="exportPDF()" class="flex items-center gap-2 px-4 py-2 bg-rose-600 text-white rounded-lg text-sm font-medium hover:bg-rose-700 transition shadow-sm">
                <i data-lucide="file-type-2" class="w-4 h-4"></i> PDF
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col lg:flex-row gap-8 w-full flex-1">
        <!-- Sidebar Bộ Lọc & Thống Kê -->
        <aside class="w-full lg:w-72 flex-shrink-0 space-y-6 no-print">
            <!-- Stats -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <h3 class="text-sm font-bold text-gray-900 mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-brand-500"></i> Thống kê</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">Tổng số câu:</span>
                        <span id="stat-total" class="font-bold text-gray-900 bg-gray-100 px-2 py-1 rounded">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">Trắc nghiệm:</span>
                        <span id="stat-mcq" class="font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">Đúng/Sai:</span>
                        <span id="stat-tf" class="font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">0</span>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <h3 class="text-sm font-bold text-gray-900 mb-4 flex items-center gap-2"><i data-lucide="filter" class="w-4 h-4 text-brand-500"></i> Bộ lọc</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Khối lớp</label>
                        <select id="filter-grade" onchange="renderQuestions()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2.5 outline-none">
                            <option value="all">Tất cả các khối</option>
                            <option value="10">Khối 10</option>
                            <option value="11">Khối 11</option>
                            <option value="12">Khối 12</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Loại câu hỏi</label>
                        <select id="filter-type" onchange="renderQuestions()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2.5 outline-none">
                            <option value="all">Tất cả loại</option>
                            <option value="mcq">Trắc nghiệm</option>
                            <option value="tf">Đúng / Sai</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Mức độ</label>
                        <select id="filter-level" onchange="renderQuestions()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2.5 outline-none">
                            <option value="all">Mọi mức độ</option>
                            <option value="Nhận biết">Nhận biết</option>
                            <option value="Thông hiểu">Thông hiểu</option>
                            <option value="Vận dụng">Vận dụng</option>
                        </select>
                    </div>
                    <button onclick="resetFilters()" class="w-full text-center text-sm text-brand-600 hover:text-brand-800 font-medium mt-2 transition">Xóa bộ lọc</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1" id="print-area">
            <div class="mb-6 border-b border-gray-200 pb-4 flex justify-between items-end no-print">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">Danh sách câu hỏi</h2>
                    <p class="text-gray-500 text-sm mt-1" id="result-count">Hiển thị 0 câu hỏi</p>
                </div>
            </div>
            
            <!-- Tiêu đề khi in -->
            <div class="hidden print:block text-center mb-6">
                <h1 class="text-2xl font-bold uppercase">Ngân Hàng Câu Hỏi</h1>
            </div>

            <div id="questions-container" class="space-y-5"></div>
        </main>
    </div>

    <!-- JS Nội bộ -->
    <script src="script.js"></script>
</body>
</html>
